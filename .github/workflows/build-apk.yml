name: Build APK

# Compila el APK de debug en la nube y lo publica como Release descargable.
# Se dispara en cada push a main y también se puede correr a mano (Actions -> Run workflow).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear/actualizar el Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Publica un Release fijo "latest" con el APK: link directo y estable para instalar.
      - name: Publish to Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: APK más reciente
          files: android/app/build/outputs/apk/debug/app-debug.apk
